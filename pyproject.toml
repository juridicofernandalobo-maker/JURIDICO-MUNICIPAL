[project]
name = "juridico-municipal"
version = "0.1.0"
description = "Radar de credores com débitos em aberto nos municípios do Ceará (SIM/TCE-CE)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3"]
teste = ["pytest>=7"]

[project.scripts]
juridico-municipal = "juridico_municipal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["juridico_municipal"]

[tool.setuptools.package-data]
juridico_municipal = ["dados/*.csv"]
